<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>影视上新快讯</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-cat="all">

  <!-- 人物动态背景层 -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="bg-vignette"></div>
    <div class="bg-scenes" id="bgScenes"></div>
  </div>

  <!-- 应用主体 -->
  <div class="app">

    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="32" height="32">
            <rect x="4" y="10" width="40" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path d="M4 18h40M16 10v8M32 10v8" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="24" cy="28" r="5" fill="currentColor"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>影视上新快讯</h1>
          <p class="brand-sub">每日上新 · 定档速览</p>
        </div>
      </div>
      <div class="sidebar-section-label">品类筛选</div>
      <nav class="category-tabs" id="categoryTabs" aria-label="品类筛选"></nav>
      <div class="sidebar-section-label" style="margin-top: 16px;">我的</div>
      <button class="tab fav-tab" id="favTab" type="button">
        <svg class="fav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        收藏夹
        <span class="fav-count" id="favCount">0</span>
      </button>
      <div class="sidebar-date" id="headerDate"></div>
    </aside>

    <!-- 右侧主内容 -->
    <div class="main">

      <!-- 轮播图：热播预热 -->
      <section class="carousel" id="carousel" aria-label="热播预热">
        <div class="carousel-track" id="carouselTrack"></div>
        <button class="carousel-arrow prev" id="carouselPrev" aria-label="上一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="carousel-arrow next" id="carouselNext" aria-label="下一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="carousel-dots" id="carouselDots"></div>
      </section>

      <!-- 纵向日期时间轴 -->
      <main class="timeline-wrap">
        <div class="timeline-rail" aria-hidden="true"></div>
        <div class="timeline" id="timeline"></div>
      </main>

      <!-- 底部说明栏 -->
      <footer class="app-footer">
        <p class="footer-note">
          <strong>说明：</strong>本页所有资讯及轮播海报均为虚构/演示内容，仅用于展示交互与视觉方案，不代表真实影视档期。
          全部背景与海报采用原创/虚化处理，不使用真实明星肖像与具体影视 IP 角色。
        </p>
        <p class="footer-meta">影视上新快讯 · 演示版 · <span id="footerYear"></span></p>
      </footer>

    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
