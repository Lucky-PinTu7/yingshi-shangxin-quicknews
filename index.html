<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影视上新快讯</title>
  <style>
    /* ============================================================
       影视上新快讯 - 样式
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #1a2332;
      --bg-deep: #0c1118;
      --bg-accent: #7d8da6;
      --radius: 14px;
      --ease: cubic-bezier(.4, 0, .2, 1);
      --speed: 0.7s;
      --tab-h: 56px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", system-ui, sans-serif;
      color: #e8ecf3;
      background: var(--bg-deep);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ---------- 背景层 ---------- */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 80% at 50% -10%, var(--bg-accent) 0%, transparent 45%),
        linear-gradient(180deg, var(--bg-color) 0%, var(--bg-deep) 100%);
      transition: background var(--speed) var(--ease);
      opacity: 0.92;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(130% 100% at 50% 30%, transparent 40%, rgba(0,0,0,0.55) 100%);
    }

    .bg-scenes {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42vh;
      min-height: 280px;
    }

    .bg-scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity var(--speed) var(--ease);
      transform: translateY(8px);
    }

    .bg-scene.active {
      opacity: 1;
      transform: translateY(0);
    }

    .bg-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: blur(1.2px);
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .bg-scene.active .bg-svg { animation: floaty 7s ease-in-out infinite; }

    /* ---------- 应用主体 ---------- */
    .app {
      position: relative;
      z-index: 1;
      max-width: 920px;
      margin: 0 auto;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---------- 顶部标题栏 ---------- */
    .app-header { padding: 34px 0 18px; }

    .header-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .brand-logo {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      backdrop-filter: blur(8px);
    }

    .brand-text h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
    }

    .brand-sub {
      font-size: 13px;
      color: rgba(232, 236, 243, 0.62);
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .header-date {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 7px 16px;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    /* ---------- 品类筛选 Tab ---------- */
    .category-tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 8px;
      padding: 12px 0;
      margin: 0 -4px;
      overflow-x: auto;
      scrollbar-width: none;
      background: linear-gradient(180deg, var(--bg-deep) 30%, transparent);
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .tab {
      position: relative;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(232, 236, 243, 0.7);
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: color .3s var(--ease), background .3s var(--ease), border-color .3s var(--ease), transform .2s var(--ease);
    }

    .tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .tab.active {
      color: #fff;
      border-color: transparent;
      background: var(--bg-accent);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .tab .tab-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 7px;
      vertical-align: middle;
      background: currentColor;
      opacity: 0.6;
    }

    /* ---------- 时间轴 ---------- */
    .timeline-wrap {
      position: relative;
      flex: 1;
      padding: 18px 0 30px;
    }

    .timeline-rail {
      position: absolute;
      left: 19px;
      top: 30px;
      bottom: 30px;
      width: 2px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.04) 0%,
        rgba(255,255,255,0.22) 15%,
        rgba(255,255,255,0.22) 85%,
        rgba(255,255,255,0.04) 100%);
    }

    .timeline { position: relative; }

    .date-section {
      position: relative;
      padding-left: 54px;
      padding-bottom: 30px;
      scroll-margin-top: 90px;
    }

    .date-section:last-child { padding-bottom: 8px; }

    .date-marker {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg-accent);
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.25);
      margin-left: 13px;
      transition: background var(--speed) var(--ease);
    }

    .date-section.is-today .date-dot {
      box-shadow: 0 0 0 4px rgba(0,0,0,0.25), 0 0 14px var(--bg-accent);
    }

    .date-title {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 2px;
    }

    .date-title .weekday {
      font-size: 12px;
      font-weight: 500;
      color: rgba(232, 236, 243, 0.55);
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .today-badge {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: var(--bg-accent);
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 1px;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25); }
      50% { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
    }

    .date-items {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: rgba(232, 236, 243, 0.45);
      font-size: 14px;
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: var(--radius);
    }

    /* ---------- 资讯卡片 ---------- */
    .news-card {
      position: relative;
      background: rgba(18, 24, 34, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--radius);
      padding: 18px 20px 16px 22px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
      transition: transform .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
      animation: cardIn .5s var(--ease) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .news-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--card-accent, var(--bg-accent));
      border-radius: 4px 0 0 4px;
    }

    .news-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(26, 34, 48, 0.68);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-time {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    .card-type {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: var(--card-accent, var(--bg-accent));
      padding: 3px 11px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .card-summary {
      font-size: 13.5px;
      line-height: 1.7;
      color: rgba(232, 236, 243, 0.72);
      margin-bottom: 14px;
    }

    .card-source {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .source-label {
      font-size: 12px;
      color: rgba(232, 236, 243, 0.5);
    }
    .source-label strong {
      color: rgba(232, 236, 243, 0.78);
      font-weight: 500;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      font-weight: 500;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 14px;
      border-radius: 8px;
      transition: background .25s var(--ease), transform .2s var(--ease);
      white-space: nowrap;
    }
    .source-link:hover {
      background: var(--card-accent, var(--bg-accent));
      transform: translateX(2px);
    }
    .source-link svg { width: 13px; height: 13px; }

    /* ---------- 滚动提示 ---------- */
    .scroll-hint {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 7px 14px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      z-index: 15;
      transition: opacity .4s var(--ease);
    }
    .scroll-hint svg { animation: bob 1.8s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }
    .scroll-hint.hidden { opacity: 0; pointer-events: none; }

    /* ---------- 底部说明栏 ---------- */
    .app-footer {
      margin-top: auto;
      padding: 28px 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .footer-note {
      font-size: 12.5px;
      line-height: 1.7;
      color: rgba(232, 236, 243, 0.5);
    }
    .footer-note strong { color: rgba(232, 236, 243, 0.72); font-weight: 600; }

    .footer-meta {
      font-size: 11.5px;
      color: rgba(232, 236, 243, 0.35);
      margin-top: 10px;
    }

    /* ---------- 响应式 ---------- */
    @media (max-width: 600px) {
      .app { padding: 0 14px 30px; }
      .brand-text h1 { font-size: 21px; }
      .brand-sub { font-size: 12px; }
      .header-date { font-size: 12px; padding: 6px 12px; }
      .date-section { padding-left: 44px; }
      .timeline-rail { left: 14px; }
      .date-dot { margin-left: 9px; }
      .news-card { padding: 16px 16px 14px 18px; }
      .card-title { font-size: 15px; }
      .card-source { flex-direction: column; align-items: flex-start; gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

        container.innerHTML = html;
      }

        var scenes = document.querySelectorAll('.bg-scene');
        scenes.forEach(function (s) {
          s.classList.toggle('active', s.getAttribute('data-scene') === catKey);
        });
      }

        var tabs = el('categoryTabs');
        var html = '';

          html +=
            '<button class="tab' + (key === activeCategory ? ' active' : '') + '" ' +
            'data-cat="' + key + '" type="button" role="tab" aria-selected="' + (key === activeCategory) + '">' +
            '<span class="tab-dot" style="color:' + c.accent + '"></span>' + c.label +
            '</button>';
        });
        tabs.innerHTML = html;

        tabs.addEventListener('click', function (e) {
          var btn = e.target.closest('.tab');
          if (!btn) return;
          var key = btn.getAttribute('data-cat');
          if (key === activeCategory) return;
          setActiveCategory(key);

          .replace(/</g, '&lt;')

            '<h2 class="date-title">' + day.label +
              '<span class="weekday">' + day.weekday + '</span>' +
              (day.isToday ? '<span class="today-badge">今日</span>' : '') +
            '</h2>' +
            '<div class="date-items">' + filtered.map(renderCard).join('') + '</div>';

          frag.appendChild(section);
        });

        if (frag.childElementCount === 0) {
          var empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = '当前品类暂无上新资讯，换个品类看看吧～';
          frag.appendChild(empty);
        }

        timeline.innerHTML = '';
        timeline.appendChild(frag);
      }

      function setActiveCategory(key) {
        activeCategory = key;
        document.querySelectorAll('.tab').forEach(function (t) {
          var on = t.getAttribute('data-cat') === key;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
        });
        applyTheme(key);
        showScene(key);
        renderTimeline();
        scrollToToday();
      }

      function scrollToToday() {
        var today = document.getElementById('today-section');
        if (today) {
          requestAnimationFrame(function () {
            today.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        } else {
          var tl = el('timeline');
          if (tl) tl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      function renderHeaderDate() {
        var d = new Date();
        var weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        el('headerDate').textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + weekdays[d.getDay()];
        el('footerYear').textContent = d.getFullYear();
      }

      function initScrollHint() {
        var hint = el('scrollHint');
        var hidden = false;
        window.addEventListener('scroll', function () {
          if (!hidden && window.scrollY > 80) {
            hint.classList.add('hidden');
            hidden = true;
          }
        }, { passive: true });
      }

      function init() {
        renderHeaderDate();
        renderScenes();
        renderTabs();
        applyTheme(activeCategory);
        showScene(activeCategory);
        renderTimeline();
        initScrollHint();
        requestAnimationFrame(function () {
          setTimeout(scrollToToday, 120);
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
