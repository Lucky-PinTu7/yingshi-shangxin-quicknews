<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>影视上新快讯</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-cat="all">

  <!-- 人物动态背景层 -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="bg-vignette"></div>
    <div class="bg-scenes" id="bgScenes"></div>
  </div>

  <!-- 应用主体 -->
  <div class="app">

    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="32" height="32">
            <rect x="4" y="10" width="40" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path d="M4 18h40M16 10v8M32 10v8" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="24" cy="28" r="5" fill="currentColor"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>影视上新快讯</h1>
          <p class="brand-sub">每日上新 · 定档速览</p>
        </div>
      </div>
      <div class="sidebar-section-label">品类筛选</div>
      <nav class="category-tabs" id="categoryTabs" aria-label="品类筛选"></nav>
      <div class="sidebar-section-label" style="margin-top: 16px;">我的</div>
      <button class="tab fav-tab" id="favTab" type="button">
        <svg class="fav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        收藏夹
        <span class="fav-count" id="favCount">0</span>
      </button>
      <div class="sidebar-date" id="headerDate"></div>
      <!-- 用户区域 -->
      <div class="user-area" id="userArea"></div>
    </aside>

    <!-- 右侧主内容 -->
    <div class="main">

      <!-- 轮播图：热播预热 -->
      <section class="carousel" id="carousel" aria-label="热播预热">
        <div class="carousel-track" id="carouselTrack"></div>
        <button class="carousel-arrow prev" id="carouselPrev" aria-label="上一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="carousel-arrow next" id="carouselNext" aria-label="下一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="carousel-dots" id="carouselDots"></div>
      </section>

      <!-- 纵向日期时间轴 -->
      <main class="timeline-wrap">
        <div class="timeline-rail" aria-hidden="true"></div>
        <div class="timeline" id="timeline"></div>
      </main>

      <!-- 底部说明栏 -->
      <footer class="app-footer">
        <p class="footer-note">
          <strong>说明：</strong>本页所有资讯及轮播海报均为虚构/演示内容，仅用于展示交互与视觉方案，不代表真实影视档期。
          全部背景与海报采用原创/虚化处理，不使用真实明星肖像与具体影视 IP 角色。
        </p>
        <p class="footer-meta">影视上新快讯 · 演示版 · <span id="footerYear"></span></p>
      </footer>

    </div>

  </div>

  <!-- 登录/注册模态框 -->
  <div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal">
      <button class="auth-modal-close" id="authModalClose" type="button" aria-label="关闭">&times;</button>
      <h2 class="auth-modal-title" id="authModalTitle">登录</h2>
      <div class="auth-modal-body">
        <div class="auth-field">
          <label for="authUsername">用户名</label>
          <input type="text" id="authUsername" placeholder="请输入用户名" autocomplete="off">
        </div>
        <div class="auth-field">
          <label for="authPassword">密码</label>
          <input type="password" id="authPassword" placeholder="请输入密码">
        </div>
        <div class="auth-error" id="authError"></div>
        <button class="auth-submit" id="authSubmit" type="button">登录</button>
      </div>
    </div>
  </div>

  <!-- AI 影视助手 -->
  <button class="ai-fab" id="aiFab" type="button" aria-label="AI 影视助手">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v1H7a3 3 0 0 0-3 3v1H3v4h1v1a3 3 0 0 0 3 3h2v1a3 3 0 0 0 6 0v-1h2a3 3 0 0 0 3-3v-1h1v-4h-1V9a3 3 0 0 0-3-3h-2V5a3 3 0 0 0-3-3z"/>
      <circle cx="9" cy="11" r="1" fill="currentColor"/>
      <circle cx="15" cy="11" r="1" fill="currentColor"/>
      <path d="M9 15s1 1 3 1 3-1 3-1"/>
    </svg>
  </button>

  <div class="ai-chat-panel" id="aiChatPanel" aria-hidden="true">
    <div class="ai-chat-header">
      <span class="ai-chat-title">AI 影视助手</span>
      <button class="ai-chat-close" id="aiChatClose" type="button" aria-label="关闭">&times;</button>
    </div>
    <div class="ai-chat-modes">
      <button class="ai-mode-tab active" data-mode="chat" type="button">问答</button>
      <button class="ai-mode-tab" data-mode="recommend" type="button">推荐</button>
      <button class="ai-mode-tab" data-mode="summary" type="button">摘要</button>
    </div>
    <div class="ai-chat-messages" id="aiChatMessages"></div>
    <div class="ai-chat-input-wrap">
      <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="输入你的问题..." autocomplete="off">
      <button class="ai-chat-send" id="aiChatSend" type="button" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
